name: Publish tarball to GitHub Release

# Manual fallback for the tarball distribution channel. Builds a
# package-manager-friendly @design-intelligence/ghost archive with runtime
# dependencies included and attaches the .tgz to a GitHub Release.
#
# The normal path is release.yml, which attaches the tarball automatically on
# every Changesets publish. This workflow is dispatch-only so a Changesets-
# created tag does not fire both workflows and race on the same Release. Use it
# to (re)cut a tarball for an existing version without a fresh npm publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match packages/ghost/package.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: tarball-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tarball:
    name: Pack and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No setup-node and no pnpm/action-setup — both would trip zizmor's
      # cache-poisoning rule because any GitHub-official setup action is
      # treated as cache-capable regardless of whether caching is enabled.
      # ubuntu-latest currently ships a compatible Node fallback. Guard the
      # supported range (^20.19 || >=22.12) before enabling the root-pinned
      # pnpm version with corepack, without creating a cross-branch cache.
      - name: Verify fallback Node and enable pnpm
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (!((major === 20 && minor >= 19) || (major >= 22 && (major !== 22 || minor >= 12)))) process.exit(1)'
          node --version
          corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm run quality:all

      - name: Validate release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const input = process.env.INPUT_VERSION;
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
            const expected = require("./packages/ghost/package.json").version;
            if (!semver.test(input ?? "")) {
              console.error(`release version is not strict semver: ${input}`);
              process.exit(1);
            }
            if (input !== expected) {
              console.error(`release version ${input} does not match package version ${expected}`);
              process.exit(1);
            }
          '

      # Keep this distribution archive separate from npm publishing: npm gets
      # the normal package, while GitHub Releases get a self-contained archive
      # for package-manager installs that should not run a registry install.
      - name: Pack
        run: |
          mkdir -p dist-tarball
          node scripts/pack-release-tarball.mjs "$GITHUB_WORKSPACE/dist-tarball"
          ls -la dist-tarball

      # Inputs from workflow_dispatch are attacker-controlled (anyone with
      # Actions write can trigger). Pass them in via `env:` and reference as
      # shell variables so they can't be interpolated as shell syntax — that's
      # what the semgrep shell-injection rule wants.
      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="design-intelligence-ghost@$INPUT_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist-tarball/*.tgz
